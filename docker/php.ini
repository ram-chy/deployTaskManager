; Runtime tuning for the Render demo container.

memory_limit = 256M
max_execution_time = 60

; Surface errors in the platform log instead of writing them to disk, so a
; failed deploy is visible without shelling into the container.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Sessions are stored in the database, but the session cookie must survive the
; TLS-terminating proxy. These are set via env vars in render.yaml.
session.cookie_httponly = 1
