# Render Blueprint — TaskManager demo
#
# ############################################################################
# #  READ THIS BEFORE DEPLOYING                                                #
# #                                                                          #
# #  Render has NO native PHP runtime.                                        #
# #                                                                          #
# #  Supported native runtimes are: node, python, ruby, go, rust, elixir.    #
# #  From Render's own docs (language-support):                              #
# #    "To run virtually any language (PHP, .NET, Java/Kotlin/Scala, etc.),  #
# #     you can deploy a Docker image."                                       #
# #                                                                          #
# #  This app is Laravel/PHP 8.4. There is no way to serve it on Render     #
# #  without a container. The repo ships a minimal Dockerfile (single PHP     #
# #  process, no nginx/PHP-FPM/supervisord) and this Blueprint is ready to   #
# #  use as-is. See the "Deployment" section of the README.                  #
# ############################################################################
#
# Free-tier notes:
#   * Free instances are ephemeral. The demo DB (SQLite) is rebuilt from
#     seed on every deploy/restart, so each visitor gets fresh demo data.
#   * Free instances spin down after ~15 min idle and restart on the next
#     request, which also re-runs migrations and seeders. They are
#     idempotent, so restarts are safe.
#   * Sessions live in the ephemeral database, so visitors are logged out
#     after a spin-down.

services:
  - type: web
    name: taskmanager
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Render generates a base64 value once and keeps it across restarts, so
      # sessions survive a container restart. Do NOT hand-write this value:
      # Laravel requires the "base64:" prefix and exactly 16 or 32 decoded
      # bytes, so a raw 43-character base64 string breaks every request with
      # "Unsupported cipher or incorrect key length".
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: APP_SEED_DEMO
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      # Render terminates TLS and forwards plain HTTP, so the request arrives
      # with scheme "http" unless the forwarded headers are trusted. Without
      # this, Laravel emits http:// asset URLs on an https:// page and the
      # browser blocks them as mixed content.
      - key: TRUSTED_PROXIES
        value: "*"
      # Reverb needs a public TCP port, which free plans do not provide.
      - key: START_REVERB
        value: "false"
      - key: BROADCAST_CONNECTION
        value: "null"
