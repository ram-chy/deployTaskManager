; Supervisor main config for the TaskManager demo container.
; Runs Nginx, PHP-FPM and the Laravel queue worker in a single container.
; Executed with: supervisord -c /etc/supervisor/supervisord.conf

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=5
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autorestart=true
startretries=5
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:queue-worker]
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=1800
directory=/var/www/html
environment=HOME="/var/www/html"
autorestart=true
startretries=5
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[include]
files=/etc/supervisor/conf.d/*.conf